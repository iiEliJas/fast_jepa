[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastjepa"
version = "0.1.0"
description = "FastJEPA: LeJEPA ground truth in PyTorch, with C/CUDA kernels in progress"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.15",
  "timm>=0.9",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]
parity = ["scipy>=1.11"]
analysis = ["matplotlib>=3.8"]

[project.scripts]
fastjepa-train = "lejepa.train:main"

[tool.setuptools]
package-dir = {"" = "pysrc"}

[tool.setuptools.packages.find]
where = ["pysrc"]
include = ["lejepa*", "common*", "lewm*", "baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pysrc"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
